[project]
name = "rag"
version = "0.1.0"
description = "Unity docs RAG pipeline: HTML ingest, Chroma retrieval, Gemini answers"
readme = "README.md"
authors = [
    { name = "gchallar", email = "gchallaram23@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "ipykernel>=7.3.0",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.6",
    "lxml>=6.1.3",
    "numpy>=2.4.6",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "llm: live Gemini calls (needs GOOGLE_API_KEY; set RUN_LLM_TESTS=1)",
]
